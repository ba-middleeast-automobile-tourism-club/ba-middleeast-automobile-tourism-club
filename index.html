<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نادي الشرق الأوسط للسيارات والسياحة</title>
    <style>
        /* تنسيقات مطابقة للأصل */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        .container { max-width: 750px; margin: 25px auto; padding: 0 15px; }
        .card { border: 1px solid rgba(0,0,0,.125); border-radius: .25rem; background: #fff; text-align: center; box-shadow: 0 .125rem .25rem rgba(0,0,0,.075); }
        .card-header { padding: .75rem 1.25rem; background-color: rgba(0,0,0,.03); border-bottom: 1px solid rgba(0,0,0,.125); }
        .h3 { margin: 0; font-size: 1.25rem; font-weight: 500; }
        .card-body { padding: 1.25rem; }
        .list-group { display: flex; flex-direction: column; padding-left: 0; margin-bottom: 0; }
        .list-group-item { padding: .75rem 1.25rem; border-bottom: 1px solid rgba(0,0,0,.125); list-style: none; }
        .badge-success { background-color: #28a745; color: white; padding: 0.25em 0.4em; border-radius: 0.25rem; font-size: 85%; vertical-align: middle; }
        .card-title { margin-bottom: .75rem; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h1 class="h3">DOCUMENT VERIFICATION</h1>
        </div>
        <div class="card-body">
            <ul class="list-group">
                <li class="list-group-item">
                    <h5 class="card-title">Document Status: 
                        <span class="badge-success">✔ VALID</span>
                    </h5>
                </li>
                <li class="list-group-item">Int. Driving License: <strong>20030061</strong></li>
                <li class="list-group-item">Issue Date: <strong>09/09/2025</strong></li>
                <li class="list-group-item">Expiration Date: <strong>08/09/2029</strong></li>
                <li class="list-group-item">Owner Name: <strong>BASIL MOHAMMAD RISHA</strong></li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>
